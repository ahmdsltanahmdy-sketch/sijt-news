name: Update Mizan News
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch and Save News
        run: |
          python -c '
          import requests
          import xml.etree.ElementTree as ET
          import json, re
          from bs4 import BeautifulSoup

          cats = {
              "allnews": "https://www.mizanonline.ir/fa/rss/allnews",
              "17": "https://www.mizanonline.ir/fa/rss/17",
              "7": "https://www.mizanonline.ir/fa/rss/7",
              "16": "https://www.mizanonline.ir/fa/rss/16",
              "10": "https://www.mizanonline.ir/fa/rss/10",
              "9": "https://www.mizanonline.ir/fa/rss/9",
              "12": "https://www.mizanonline.ir/fa/rss/12",
              "11": "https://www.mizanonline.ir/fa/rss/11",
              "13": "https://www.mizanonline.ir/fa/rss/13",
              "14": "https://www.mizanonline.ir/fa/rss/14",
              "4": "https://www.mizanonline.ir/fa/rss/4"
          }

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          data_store = {}

          for k, url in cats.items():
              try:
                  res = requests.get(url, headers=headers, timeout=12)
                  root = ET.fromstring(res.content)
                  items = []
                  for it in root.findall(".//item")[:60]:
                      title = it.findtext("title", "").strip()
                      link = it.findtext("link", "").strip()
                      desc = it.findtext("description", "")
                      pub = it.findtext("pubDate", "")
                      
                      time_parts = pub.split(" ")
                      time_str = time_parts[4] if len(time_parts) > 4 else (time_parts[1] if len(time_parts) > 1 else "چند لحظه پیش")

                      img = None
                      enc = it.find("enclosure")
                      if enc is not None and enc.get("url"):
                          img = enc.get("url")
                      
                      if not img and desc:
                          m = re.search(r"src=[\"\x27]([^\"]+\.(?:jpg|jpeg|png|webp))", desc, re.IGNORECASE)
                          if m:
                              img = m.group(1)

                      if img:
                          if img.startswith("//"):
                              img = "https:" + img
                          elif img.startswith("/"):
                              img = "https://www.mizanonline.ir" + img
                          elif img.startswith("http://"):
                              img = img.replace("http://", "https://")

                      soup = BeautifulSoup(desc, "html.parser")
                      snippet = soup.get_text()[:130].strip() + "..."

                      if title and link:
                          items.append({
                              "title": title,
                              "link": link,
                              "pubDate": time_str,
                              "snippet": snippet,
                              "image": img
                          })
                  data_store[k] = items
              except Exception as e:
                  data_store[k] = []

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(data_store, f, ensure_ascii=False, indent=2)
          '

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add news.json
          git commit -m "Live Sync News [skip ci]" || exit 0
          git push
