<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>خبرگزاری میزان | پیشخوان هوشمند</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f4f5f8;
      --card-bg: #ffffff;
      --header-bg: #990000;
      --text: #111827;
      --text-muted: #64748b;
      --accent: #b91c1c;
      --accent-grad: linear-gradient(135deg, #990000, #dc2626);
      --border: #e2e8f0;
      --pill: rgba(185, 28, 28, 0.08);
      --card-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    body[data-theme="dark"] {
      --bg: #0b111e;
      --card-bg: #162032;
      --header-bg: #101726;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-grad: linear-gradient(135deg, #0284c7, #38bdf8);
      --border: rgba(255, 255, 255, 0.08);
      --pill: rgba(56, 189, 248, 0.12);
      --card-shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", Tahoma, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 74px;
      user-select: none;
      min-height: 100vh;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .app-wrap {
      max-width: 680px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--header-bg);
      color: #fff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .brand-title { font-size: 1.05rem; font-weight: 800; }
    .brand-status { font-size: 0.65rem; opacity: 0.85; display: block; }
    .btn-h {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.72rem;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
    }

    .tabs-bar {
      position: sticky;
      top: 52px;
      z-index: 190;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 6px 10px;
    }
    .tabs-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs-scroll::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 0.76rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: var(--accent-grad);
      color: #ffffff;
      border-color: transparent;
      transform: translateY(-1px);
    }

    .tool-bar {
      padding: 8px 12px 2px 12px;
      display: flex;
      gap: 8px;
    }
    .search-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      gap: 6px;
    }
    .search-wrap input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.82rem;
      width: 100%;
    }

    .feed-container {
      padding: 8px 12px;
      flex: 1;
    }
    .card-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
    }
    .card-touch {
      display: flex;
      padding: 10px;
      gap: 10px;
      cursor: pointer;
    }
    .img-wrap {
      width: 95px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }
    .card-title {
      font-size: 0.86rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 3px;
    }
    .card-lead {
      font-size: 0.74rem;
      color: var(--text-muted);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-footer {
      background: var(--pill);
      border-top: 1px solid var(--border);
      padding: 5px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .act-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.74rem;
      padding: 2px 6px;
      font-family: inherit;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 300;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      font-size: 0.7rem;
      cursor: pointer;
      flex: 1;
      font-family: inherit;
    }
    .nav-btn.active { color: var(--accent); font-weight: 700; }
    .nav-btn .icon { font-size: 1.15rem; }
  </style>
</head>
<body data-theme="mizan-red">

  <div class="app-wrap">
    <header class="top-header">
      <div>
        <div class="brand-title">خبرگزاری میزان</div>
        <span class="brand-status" id="clock-status">درحال دریافت...</span>
      </div>
      <button class="btn-h" onclick="loadNews()">🔄 تازه‌سازی</button>
    </header>

    <nav class="tabs-bar">
      <div class="tabs-scroll">
        <button class="tab-btn active" data-cat="allnews">📌 همه اخبار</button>
        <button class="tab-btn" data-cat="17">⚖️ قضایی</button>
        <button class="tab-btn" data-cat="7">🕊️ حقوق بشر</button>
        <button class="tab-btn" data-cat="16">📖 مجله حقوقی</button>
        <button class="tab-btn" data-cat="10">🏛️ سیاست</button>
        <button class="tab-btn" data-cat="9">👥 جامعه</button>
        <button class="tab-btn" data-cat="12">🎭 فرهنگی</button>
        <button class="tab-btn" data-cat="11">📈 اقتصاد</button>
        <button class="tab-btn" data-cat="13">⚽ ورزشی</button>
        <button class="tab-btn" data-cat="14">🌍 جهان</button>
        <button class="tab-btn" data-cat="4">📸 عکس</button>
      </div>
    </nav>

    <div class="tool-bar">
      <div class="search-wrap">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="جستجوی آنی در اخبار..." oninput="filterData(this.value)" />
      </div>
    </div>

    <main class="feed-container" id="feedList">
      <div style="text-align:center;padding:50px;color:var(--text-muted);">در حال دریافت جدیدترین اخبار...</div>
    </main>

    <footer class="bottom-nav">
      <button class="nav-btn active" onclick="loadNews()">
        <span class="icon">📰</span>
        <span>پیشخوان</span>
      </button>
      <button class="nav-btn" onclick="openDirect('https://www.mizanonline.ir/fa/archive')">
        <span class="icon">🌐</span>
        <span>سایت اصلی</span>
      </button>
    </footer>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let allNewsData = {};
    let currentCat = 'allnews';

    async function loadNews() {
      const clock = document.getElementById('clock-status');
      clock.innerText = 'همگام‌سازی...';

      try {
        // خواندن مستقیم فایل جیسون ذخیره‌شده روی گیت‌هاب بدون نیاز به پروکسی خارجی
        const res = await fetch(`./news.json?_t=${Date.now()}`);
        if (res.ok) {
          allNewsData = await res.json();
          renderCategory(currentCat);
          const d = new Date();
          clock.innerText = `بروز شده: ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
          return;
        }
      } catch (err) {}

      document.getElementById('feedList').innerHTML = `
        <div style="text-align:center;padding:50px 20px;color:var(--text-muted);">
          <p>در حال آماده‌سازی منبع اخبار...</p>
          <button class="btn-h" style="background:var(--accent);margin-top:10px;" onclick="loadNews()">تلاش مجدد 🔄</button>
        </div>
      `;
      clock.innerText = 'خطا در ارتباط';
    }

    function renderCategory(cat) {
      const list = allNewsData[cat] || [];
      const container = document.getElementById('feedList');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:50px;color:var(--text-muted);">خبری یافت نشد.</div>';
        return;
      }

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="card-touch" onclick="openDirect('${item.link}')">
            <div class="img-wrap">
              ${item.image ? 
                `<img src="${item.image}" alt="عکس خبر" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
                 <span style="display:none;font-size:1.8rem;color:#a0aec0;">⚖️</span>` 
                : `<span style="font-size:1.8rem;color:#a0aec0;">⚖️</span>`
              }
            </div>
            <div class="card-body">
              <div class="card-title">${item.title}</div>
              <div class="card-lead">${item.snippet}</div>
            </div>
          </div>
          <div class="card-footer">
            <span>🕒 ${item.pubDate}</span>
            <button class="act-btn" onclick="shareArticle('${item.title}', '${item.link}')">↗ اشتراک در تلگرام</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterData(q) {
      const list = allNewsData[currentCat] || [];
      if (!q || !q.trim()) {
        renderCategory(currentCat);
        return;
      }
      const term = q.toLowerCase().trim();
      const filtered = list.filter(i => i.title.toLowerCase().includes(term) || i.snippet.toLowerCase().includes(term));
      
      const container = document.getElementById('feedList');
      container.innerHTML = '';
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="card-touch" onclick="openDirect('${item.link}')">
            <div class="card-body">
              <div class="card-title">${item.title}</div>
              <div class="card-lead">${item.snippet}</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openDirect(url) {
      if (tg && tg.openLink) { tg.openLink(url); } else { window.open(url, '_blank'); }
    }

    function shareArticle(title, url) {
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`;
      if (tg && tg.openTelegramLink) { tg.openTelegramLink(shareUrl); } else { window.open(shareUrl, '_blank'); }
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentCat = this.dataset.cat;
        document.getElementById('searchInput').value = '';
        renderCategory(currentCat);
      });
    });

    loadNews();
  </script>
</body>
</html>
