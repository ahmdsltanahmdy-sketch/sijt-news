<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>خبرگزاری میزان | پیشخوان هوشمند</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f4f5f8;
      --card-bg: #ffffff;
      --header-bg: #990000;
      --text: #111827;
      --text-muted: #64748b;
      --accent: #b91c1c;
      --accent-grad: linear-gradient(135deg, #990000, #dc2626);
      --border: #e2e8f0;
      --pill: rgba(185, 28, 28, 0.08);
      --card-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    body[data-theme="dark"] {
      --bg: #0b111e;
      --card-bg: #162032;
      --header-bg: #101726;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-grad: linear-gradient(135deg, #0284c7, #38bdf8);
      --border: rgba(255, 255, 255, 0.08);
      --pill: rgba(56, 189, 248, 0.12);
      --card-shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", Tahoma, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 74px;
      user-select: none;
      min-height: 100vh;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .app-wrap {
      max-width: 680px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--header-bg);
      color: #fff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .brand-title { font-size: 1.05rem; font-weight: 800; }
    .brand-status { font-size: 0.65rem; opacity: 0.85; display: block; }
    
    .btn-h {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.72rem;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
    }
    .btn-h:active { transform: scale(0.95); }

    .tabs-bar {
      position: sticky;
      top: 52px;
      z-index: 190;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 6px 10px;
    }
    .tabs-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs-scroll::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 0.76rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: var(--accent-grad);
      color: #ffffff;
      border-color: transparent;
    }

    .tool-bar {
      padding: 8px 12px 2px 12px;
    }
    .search-wrap {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      gap: 6px;
    }
    .search-wrap input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.82rem;
      width: 100%;
    }

    .feed-container {
      padding: 8px 12px;
      flex: 1;
    }
    .card-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
    }
    .card-touch {
      display: flex;
      padding: 10px;
      gap: 10px;
      cursor: pointer;
    }
    .img-wrap {
      width: 95px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }
    .card-title {
      font-size: 0.86rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 3px;
    }
    .card-lead {
      font-size: 0.74rem;
      color: var(--text-muted);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-footer {
      background: var(--pill);
      border-top: 1px solid var(--border);
      padding: 5px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .act-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.74rem;
      padding: 2px 6px;
      font-family: inherit;
    }

    .scroll-loader {
      text-align: center;
      padding: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .reader-modal {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 400;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }
    .reader-modal.active { display: flex; }
    .reader-header {
      position: sticky;
      top: 0;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .reader-body {
      padding: 16px;
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
    }
    .reader-img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .reader-title {
      font-size: 1.1rem;
      font-weight: 800;
      line-height: 1.45;
      margin-bottom: 10px;
    }
    .reader-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: flex;
      gap: 12px;
    }
    .reader-text {
      font-size: 0.9rem;
      line-height: 1.7;
      color: var(--text);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 300;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      font-size: 0.7rem;
      cursor: pointer;
      flex: 1;
      font-family: inherit;
    }
    .nav-btn.active { color: var(--accent); font-weight: 700; }
    .nav-btn .icon { font-size: 1.15rem; }

    .toast {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(15px);
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 6px 16px;
      border-radius: 18px;
      font-size: 0.75rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s;
      z-index: 1000;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body data-theme="mizan-red">

  <div class="app-wrap">
    <header class="top-header">
      <div>
        <div class="brand-title">خبرگزاری میزان</div>
        <span class="brand-status" id="clock-status">در حال دریافت اخبار زنده...</span>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="btn-h" onclick="manualSync()">🔄 تازه‌سازی</button>
        <button class="btn-h" onclick="toggleTheme()">🎨 تم</button>
      </div>
    </header>

    <nav class="tabs-bar">
      <div class="tabs-scroll">
        <button class="tab-btn active" data-cat="allnews">📌 همه اخبار</button>
        <button class="tab-btn" data-cat="17">⚖️ قضایی</button>
        <button class="tab-btn" data-cat="7">🕊️ حقوق بشر</button>
        <button class="tab-btn" data-cat="16">📖 مجله حقوقی</button>
        <button class="tab-btn" data-cat="10">🏛️ سیاست</button>
        <button class="tab-btn" data-cat="9">👥 جامعه</button>
        <button class="tab-btn" data-cat="12">🎭 فرهنگی</button>
        <button class="tab-btn" data-cat="11">📈 اقتصاد</button>
        <button class="tab-btn" data-cat="13">⚽ ورزشی</button>
        <button class="tab-btn" data-cat="14">🌍 جهان</button>
        <button class="tab-btn" data-cat="4">📸 عکس</button>
      </div>
    </nav>

    <div class="tool-bar">
      <div class="search-wrap">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="جستجوی آنی در اخبار..." oninput="filterData(this.value)" />
      </div>
    </div>

    <main class="feed-container" id="feedList">
      <div style="text-align:center;padding:50px;color:var(--text-muted);">در حال دریافت جدیدترین اخبار...</div>
    </main>
    <div class="scroll-loader" id="scrollLoader" style="display:none;">در حال اسکرول به اخبار قبل...</div>

    <div class="reader-modal" id="readerModal">
      <div class="reader-header">
        <button class="btn-h" style="background:var(--accent);color:#fff;" onclick="closeReader()">بازگشت ✕</button>
        <button class="btn-h" style="background:transparent;color:var(--text);border-color:var(--border);" onclick="openExternalFromReader()">سایت اصلی ↗</button>
      </div>
      <div class="reader-body">
        <img id="readerImg" class="reader-img" src="" alt="عکس خبر" onerror="this.style.display='none';" />
        <h2 id="readerTitle" class="reader-title"></h2>
        <div class="reader-meta">
          <span id="readerDate"></span>
          <span>خبرگزاری میزان</span>
        </div>
        <div id="readerText" class="reader-text"></div>
      </div>
    </div>

    <div class="toast" id="toastBox">پیام</div>

    <footer class="bottom-nav">
      <button class="nav-btn active" id="btn-home" onclick="setScreen('home')">
        <span class="icon">📰</span>
        <span>پیشخوان</span>
      </button>
      <button class="nav-btn" id="btn-fav" onclick="setScreen('fav')">
        <span class="icon">⭐</span>
        <span>نشان‌شده‌ها</span>
      </button>
      <button class="nav-btn" onclick="manualSync()">
        <span class="icon">🔄</span>
        <span>تازه‌سازی</span>
      </button>
      <button class="nav-btn" onclick="openDirect('https://www.mizanonline.ir/fa/archive')">
        <span class="icon">🌐</span>
        <span>سایت اصلی</span>
      </button>
    </footer>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let currentCat = 'allnews';
    let currentScreen = 'home';
    let allNewsItems = [];
    let displayedCount = 10;
    let isFetching = false;
    let currentReading = null;
    let bookmarks = JSON.parse(localStorage.getItem('mizan_favs_v5') || '[]');

    function showToast(msg) {
      const t = document.getElementById('toastBox');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function toggleTheme() {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'mizan-red' : 'dark');
      showToast(isDark ? 'تم قرمز میزان' : 'تم تاریک');
    }

    function cleanSnippet(txt) {
      if (!txt) return '';
      const doc = new DOMParser().parseFromString(txt, 'text/html');
      return (doc.body.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 115) + '...';
    }

    function extractImage(desc, itemXml) {
      if (itemXml) {
        const enc = itemXml.querySelector('enclosure');
        if (enc && enc.getAttribute('url')) return enc.getAttribute('url');
      }
      if (desc) {
        const m = desc.match(/src=["']([^"']+\.(?:jpg|jpeg|png|webp)[^"']*)["']/i);
        if (m && m[1]) return m[1];
      }
      return null;
    }

    // متد JSONP پایدار و قطعی: بدون بلاک CORS، بدون افت سرعت و بدون نیاز به هیچ ابزار لاگین
    function fetchLiveFeedViaJSONP(cat) {
      const clock = document.getElementById('clock-status');
      clock.innerText = 'همگام‌سازی زنده...';

      const targetRss = `https://www.mizanonline.ir/fa/rss/${cat}?_t=${Date.now()}`;
      const scriptId = 'jsonp_mizan_script';
      const prevScript = document.getElementById(scriptId);
      if (prevScript) prevScript.remove();

      // ساخت کال‌بک سراسری موقت
      const callbackName = 'mizan_jsonp_' + Date.now();
      window[callbackName] = function(data) {
        delete window[callbackName];
        const s = document.getElementById(scriptId);
        if (s) s.remove();

        if (data && data.contents) {
          parseAndRenderXml(data.contents);
        } else {
          showFallbackError();
        }
      };

      // از درگاه استریم پایدار JSONP آل‌اوریجینز استفاده می‌شود که فیلتر CORS ندارد
      const script = document.createElement('script');
      script.id = scriptId;
      script.src = `https://api.allorigins.win/get?url=${encodeURIComponent(targetRss)}&callback=${callbackName}`;
      
      script.onerror = function() {
        delete window[callbackName];
        showFallbackError();
      };

      document.body.appendChild(script);
    }

    function parseAndRenderXml(xmlText) {
      const clock = document.getElementById('clock-status');
      try {
        const xmlDoc = new DOMParser().parseFromString(xmlText, 'text/xml');
        const items = xmlDoc.querySelectorAll('item');
        const list = [];

        items.forEach(node => {
          const title = node.querySelector('title')?.textContent?.trim() || '';
          const link = node.querySelector('link')?.textContent?.trim() || '';
          const desc = node.querySelector('description')?.textContent || '';
          const pubDate = node.querySelector('pubDate')?.textContent || '';
          const time = pubDate.split(' ')[4] || pubDate.split(' ')[1] || 'چند لحظه پیش';

          if (title && link) {
            list.push({
              title,
              link,
              pubDate: time,
              snippet: cleanSnippet(desc),
              image: extractImage(desc, node)
            });
          }
        });

        if (list.length > 0) {
          allNewsItems = list;
          displayedCount = 10;
          renderFeedList();
          const d = new Date();
          clock.innerText = `بروزرسانی: ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
          showToast('جدیدترین اخبار همگام شد');
        } else {
          showFallbackError();
        }
      } catch(e) {
        showFallbackError();
      }
    }

    function showFallbackError() {
      const clock = document.getElementById('clock-status');
      clock.innerText = 'خطای ارتباط';
      document.getElementById('feedList').innerHTML = `
        <div style="text-align:center;padding:50px 20px;color:var(--text-muted);">
          <p>امکان ارتباط مستقیم برقرار نشد.</p>
          <button class="btn-h" style="background:var(--accent);margin-top:12px;" onclick="manualSync()">تلاش مجدد 🔄</button>
        </div>
      `;
    }

    function renderFeedList() {
      const container = document.getElementById('feedList');
      const loader = document.getElementById('scrollLoader');
      container.innerHTML = '';

      if (allNewsItems.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:50px;color:var(--text-muted);">خبری یافت نشد.</div>';
        loader.style.display = 'none';
        return;
      }

      const slice = allNewsItems.slice(0, displayedCount);
      slice.forEach(item => {
        const isFav = bookmarks.some(b => b.link === item.link);
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="card-touch" onclick="openReader('${encodeURIComponent(JSON.stringify(item))}')">
            <div class="img-wrap">
              ${item.image ? 
                `<img src="${item.image}" alt="عکس خبر" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
                 <span style="display:none;font-size:1.8rem;color:#a0aec0;">⚖️</span>` 
                : `<span style="font-size:1.8rem;color:#a0aec0;">⚖️</span>`
              }
            </div>
            <div class="card-body">
              <div class="card-title">${item.title}</div>
              <div class="card-lead">${item.snippet}</div>
            </div>
          </div>
          <div class="card-footer">
            <span>🕒 ${item.pubDate}</span>
            <div>
              <button class="act-btn" onclick="toggleSave('${encodeURIComponent(JSON.stringify(item))}')">
                ${isFav ? '★ نشان‌شده' : '☆ ذخیره'}
              </button>
              <button class="act-btn" onclick="shareArticle('${item.title}', '${item.link}')">↗ اشتراک</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      loader.style.display = displayedCount < allNewsItems.length ? 'block' : 'none';
    }

    // اسکرول بی‌نهایت پیوسته
    window.addEventListener('scroll', () => {
      if (currentScreen !== 'home' || displayedCount >= allNewsItems.length || isFetching) return;

      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 250) {
        isFetching = true;
        setTimeout(() => {
          displayedCount += 10;
          renderFeedList();
          isFetching = false;
        }, 150);
      }
    });

    function openReader(enc) {
      currentReading = JSON.parse(decodeURIComponent(enc));
      const m = document.getElementById('readerModal');
      document.getElementById('readerTitle').innerText = currentReading.title;
      document.getElementById('readerDate').innerText = `🕒 ${currentReading.pubDate}`;
      document.getElementById('readerText').innerText = currentReading.snippet;

      const imgEl = document.getElementById('readerImg');
      if (currentReading.image) {
        imgEl.src = currentReading.image;
        imgEl.style.display = 'block';
      } else {
        imgEl.style.display = 'none';
      }
      m.classList.add('active');
    }

    function closeReader() {
      document.getElementById('readerModal').classList.remove('active');
    }

    function openExternalFromReader() {
      if (currentReading && currentReading.link) openDirect(currentReading.link);
    }

    function filterData(q) {
      const loader = document.getElementById('scrollLoader');
      if (!q || !q.trim()) {
        displayedCount = 10;
        renderFeedList();
        return;
      }
      const term = q.toLowerCase().trim();
      const filtered = allNewsItems.filter(i => i.title.toLowerCase().includes(term) || i.snippet.toLowerCase().includes(term));
      
      const container = document.getElementById('feedList');
      container.innerHTML = '';
      loader.style.display = 'none';

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="card-touch" onclick="openReader('${encodeURIComponent(JSON.stringify(item))}')">
            <div class="card-body">
              <div class="card-title">${item.title}</div>
              <div class="card-lead">${item.snippet}</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleSave(enc) {
      const item = JSON.parse(decodeURIComponent(enc));
      const idx = bookmarks.findIndex(b => b.link === item.link);
      if (idx > -1) {
        bookmarks.splice(idx, 1);
        showToast('از نشان‌شده‌ها حذف شد');
      } else {
        bookmarks.push(item);
        showToast('به نشان‌شده‌ها اضافه شد');
      }
      localStorage.setItem('mizan_favs_v5', JSON.stringify(bookmarks));
      if (currentScreen === 'fav') renderBookmarks(); else renderFeedList();
    }

    function renderBookmarks() {
      const container = document.getElementById('feedList');
      const loader = document.getElementById('scrollLoader');
      container.innerHTML = '';
      loader.style.display = 'none';

      if (bookmarks.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-muted);">هیچ خبری نشان نشده است.</div>';
        return;
      }

      bookmarks.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="card-touch" onclick="openReader('${encodeURIComponent(JSON.stringify(item))}')">
            <div class="card-body">
              <div class="card-title">${item.title}</div>
              <div class="card-lead">${item.snippet}</div>
            </div>
          </div>
          <div class="card-footer">
            <span>🕒 ${item.pubDate}</span>
            <button class="act-btn" style="color:var(--accent);" onclick="toggleSave('${encodeURIComponent(JSON.stringify(item))}')">🗑 حذف</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function setScreen(s) {
      currentScreen = s;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      const tabs = document.querySelector('.tabs-bar');
      const tool = document.querySelector('.tool-bar');
      const loader = document.getElementById('scrollLoader');

      if (s === 'home') {
        document.getElementById('btn-home').classList.add('active');
        tabs.style.display = 'block';
        tool.style.display = 'block';
        renderFeedList();
      } else {
        document.getElementById('btn-fav').classList.add('active');
        tabs.style.display = 'none';
        tool.style.display = 'none';
        loader.style.display = 'none';
        renderBookmarks();
      }
    }

    function manualSync() {
      fetchLiveFeedViaJSONP(currentCat);
    }

    function openDirect(url) {
      if (tg && tg.openLink) { tg.openLink(url); } else { window.open(url, '_blank'); }
    }

    function shareArticle(title, url) {
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`;
      if (tg && tg.openTelegramLink) { tg.openTelegramLink(shareUrl); } else { window.open(shareUrl, '_blank'); }
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentCat = this.dataset.cat;
        displayedCount = 10;
        document.getElementById('searchInput').value = '';
        fetchLiveFeedViaJSONP(currentCat);
      });
    });

    // شروع دریافت لحظه‌ای
    fetchLiveFeedViaJSONP(currentCat);
  </script>
</body>
</html>
