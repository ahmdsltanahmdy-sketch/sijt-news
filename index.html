<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>خبرگزاری میزان | پیشخوان هوشمند</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f5f6f8;
      --card-bg: #ffffff;
      --header-bg: #990000;
      --text: #1a202c;
      --text-muted: #718096;
      --accent: #b91c1c;
      --accent-grad: linear-gradient(135deg, #990000, #c53030);
      --border: #e2e8f0;
      --pill: rgba(185, 28, 28, 0.08);
      --card-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    [data-theme="dark"] {
      --bg: #0d131f;
      --card-bg: #162032;
      --header-bg: #111a2b;
      --text: #f7fafc;
      --text-muted: #a0aec0;
      --accent: #38bdf8;
      --accent-grad: linear-gradient(135deg, #0284c7, #38bdf8);
      --border: rgba(255, 255, 255, 0.08);
      --pill: rgba(56, 189, 248, 0.12);
      --card-shadow: 0 4px 12px rgba(0,0,0,0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", Tahoma, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 74px;
      user-select: none;
      min-height: 100vh;
      font-size: 13.5px;
      line-height: 1.5;
    }
    .header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--header-bg);
      color: #fff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title { font-size: 1.05rem; font-weight: 800; }
    .header-sub { font-size: 0.65rem; opacity: 0.85; display: block; }
    .hdr-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.72rem;
      cursor: pointer;
      font-weight: 600;
      font-family: inherit;
    }
    .tabs-bar {
      position: sticky;
      top: 52px;
      z-index: 190;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 6px 10px;
    }
    .tabs-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs-scroll::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 0.76rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      font-family: inherit;
    }
    .tab-btn.active {
      background: var(--accent-grad);
      color: #ffffff;
      border-color: transparent;
    }
    .search-box {
      padding: 8px 12px 2px 12px;
    }
    .search-inner {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      gap: 6px;
    }
    .search-inner input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.82rem;
      width: 100%;
    }
    .feed {
      padding: 8px 12px;
      max-width: 680px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
    }
    .card-touch {
      display: flex;
      padding: 10px;
      gap: 10px;
      cursor: pointer;
    }
    .img-wrap {
      width: 95px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .img-fallback {
      display: none;
      font-size: 1.8rem;
      color: #a0aec0;
    }
    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }
    .card-title {
      font-size: 0.86rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 3px;
    }
    .card-lead {
      font-size: 0.74rem;
      color: var(--text-muted);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-footer {
      background: var(--pill);
      border-top: 1px solid var(--border);
      padding: 5px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .act-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.74rem;
      padding: 2px 6px;
      font-family: inherit;
    }
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 300;
    }
    .nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      font-size: 0.7rem;
      cursor: pointer;
      flex: 1;
      font-family: inherit;
    }
    .nav-item.active { color: var(--accent); font-weight: 700; }
    .nav-item .icon { font-size: 1.15rem; }
    .toast {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(15px);
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 6px 16px;
      border-radius: 18px;
      font-size: 0.75rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s;
      z-index: 1000;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header class="header">
    <div>
      <div class="header-title">خبرگزاری میزان</div>
      <span class="header-sub" id="clock-status">در حال دریافت اخبار...</span>
    </div>
    <div style="display:flex;gap:6px;">
      <button class="hdr-btn" onclick="syncData()">🔄 تازه‌سازی</button>
      <button class="hdr-btn" onclick="toggleTheme()">🎨 تم</button>
    </div>
  </header>

  <nav class="tabs-bar" id="tabsBar">
    <div class="tabs-scroll">
      <button class="tab-btn active" data-cat="all">📌 همه اخبار</button>
      <button class="tab-btn" data-cat="judicial">⚖️ قضایی</button>
      <button class="tab-btn" data-cat="human_rights">🕊️ حقوق بشر</button>
      <button class="tab-btn" data-cat="law_magazine">📖 مجله حقوقی</button>
      <button class="tab-btn" data-cat="politics">🏛️ سیاست</button>
      <button class="tab-btn" data-cat="society">👥 جامعه</button>
      <button class="tab-btn" data-cat="culture">🎭 فرهنگی</button>
      <button class="tab-btn" data-cat="economy">📈 اقتصاد</button>
      <button class="tab-btn" data-cat="sports">⚽ ورزشی</button>
      <button class="tab-btn" data-cat="world">🌍 جهان</button>
      <button class="tab-btn" data-cat="photos">📸 عکس</button>
    </div>
  </nav>

  <div class="search-box" id="searchBox">
    <div class="search-inner">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="جستجوی سریع در سرتیترها..." oninput="searchNews(this.value)" />
    </div>
  </div>

  <main class="feed" id="feedList">
    <div style="text-align:center;padding:50px 20px;color:var(--text-muted);">در حال همگام‌سازی لحظه‌ای اخبار...</div>
  </main>

  <div class="toast" id="toastBox">پیام</div>

  <footer class="nav-bar">
    <button class="nav-item active" id="btn-home" onclick="setScreen('home')">
      <span class="icon">📰</span>
      <span>پیشخوان</span>
    </button>
    <button class="nav-item" id="btn-fav" onclick="setScreen('fav')">
      <span class="icon">⭐</span>
      <span>نشان‌شده‌ها</span>
    </button>
    <button class="nav-item" onclick="syncData()">
      <span class="icon">🔄</span>
      <span>تازه‌سازی فوری</span>
    </button>
    <button class="nav-item" onclick="openLink('https://www.mizanonline.ir/fa/archive')">
      <span class="icon">🌐</span>
      <span>سایت اصلی</span>
    </button>
  </footer>

  <script>
    const tg = window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const CATEGORIES = {
      all: 'allnews',
      judicial: '17',
      human_rights: '7',
      law_magazine: '16',
      politics: '10',
      society: '9',
      culture: '12',
      economy: '11',
      sports: '13',
      world: '14',
      photos: '4'
    };

    let currentCat = 'all';
    let currentScreen = 'home';
    let loadedNews = [];
    let bookmarks = JSON.parse(localStorage.getItem('mizan_bookmarks') || '[]');

    function showToast(msg) {
      const t = document.getElementById('toastBox');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function toggleTheme() {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'mizan-red' : 'dark');
      showToast(isDark ? 'تم قرمز میزان' : 'تم تاریک');
    }

    // استخراج دقیق تصویر بدون مسدودی سرور
    function extractImage(description, itemNode) {
      // 1. بررسی تگ استاندارد enclosure
      if (itemNode) {
        const enc = itemNode.querySelector('enclosure');
        if (enc && enc.getAttribute('url')) {
          return enc.getAttribute('url');
        }
      }
      // 2. استخراج از داخل متن description
      if (description) {
        const match = description.match(/src=["']([^"']+\.(?:jpg|jpeg|png|webp)[^"']*)["']/i);
        if (match && match[1]) {
          return match[1];
        }
      }
      return null;
    }

    function cleanSnippet(txt) {
      if (!txt) return '';
      const doc = new DOMParser().parseFromString(txt, 'text/html');
      return (doc.body.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 110) + '...';
    }

    // موتور واکشی مستقیم و چندمسیری با زمان لحظه‌ای (رفع کش ۸:۴۵)
    async function fetchFreshNews(cat) {
      const clock = document.getElementById('clock-status');
      clock.innerText = 'در حال ارتباط زنده...';

      const feedCode = CATEGORIES[cat] || 'allnews';
      const rawRssUrl = `https://www.mizanonline.ir/fa/rss/${feedCode}`;
      
      // افزودن زمان فعلی به میلی‌ثانیه برای دور زدن کش سرورهای واسط
      const nocacheParam = `_t=${Date.now()}&_rand=${Math.random()}`;
      
      // استفاده از پایپ‌های باز و پروکسی‌های اختصاصی با متد مستقیم GET
      const sources = [
        `https://corsproxy.io/?url=${encodeURIComponent(rawRssUrl + '?' + nocacheParam)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(rawRssUrl + '?' + nocacheParam)}`,
        `https://proxy.cors.sh/${rawRssUrl}?${nocacheParam}`
      ];

      let rawXml = null;

      for (const endpoint of sources) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 4000);
          
          const res = await fetch(endpoint, { 
            signal: controller.signal,
            cache: 'no-store',
            headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
          });
          clearTimeout(timer);

          if (res.ok) {
            rawXml = await res.text();
            if (rawXml && rawXml.includes('<item>')) {
              break;
            }
          }
        } catch (e) {
          console.warn("Retrying with next live pipeline...");
        }
      }

      if (!rawXml || !rawXml.includes('<item>')) {
        clock.innerText = 'خطای ارتباط با سرور';
        showToast('امکان دریافت داده از خبرگزاری فراهم نشد.');
        return;
      }

      try {
        const xmlDoc = new DOMParser().parseFromString(rawXml, 'text/xml');
        const items = xmlDoc.querySelectorAll('item');
        const list = [];

        items.forEach(node => {
          const title = node.querySelector('title')?.textContent?.trim() || '';
          const link = node.querySelector('link')?.textContent?.trim() || '';
          const desc = node.querySelector('description')?.textContent || '';
          const pubDate = node.querySelector('pubDate')?.textContent || '';
          
          // تنظیم فرمت نمایش ساعت دقیق خبر
          const time = pubDate.split(' ')[4] || pubDate.split(' ')[1] || 'لحظاتی پیش';

          if (title && link) {
            list.push({
              title,
              link,
              pubDate: time,
              snippet: cleanSnippet(desc),
              image: extractImage(desc, node)
            });
          }
        });

        if (list.length > 0) {
          loadedNews = list;
          renderList(loadedNews);
          const now = new Date();
          clock.innerText = `بروز شده: ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
          showToast('اخبار زنده دریافت شد');
        }
      } catch (err) {
        clock.innerText = 'خطای پردازش اخبار';
      }
    }

    function renderList(list) {
      const container = document.getElementById('feedList');
      container.innerHTML = '';

      if (!list || list.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:50px;color:var(--text-muted);">خبری پیدا نشد.</div>';
        return;
      }

      list.forEach(item => {
        const isFav = bookmarks.some(b => b.link === item.link);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-touch" onclick="openLink('${item.link}')">
            <div class="img-wrap">
              ${item.image ? 
                `<img src="${item.image}" alt="تصویر خبر" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
                 <span class="img-fallback" style="display:none;">⚖️</span>`
                : `<span class="img-fallback" style="display:block;">⚖️</span>`
              }
            </div>
            <div class="card-body">
              <div class="card-title">${item.title}</div>
              <div class="card-lead">${item.snippet}</div>
            </div>
          </div>
          <div class="card-footer">
            <span>🕒 ${item.pubDate}</span>
            <div>
              <button class="act-btn" onclick="toggleSave('${encodeURIComponent(JSON.stringify(item))}')">
                ${isFav ? '★ نشان‌شده' : '☆ ذخیره'}
              </button>
              <button class="act-btn" onclick="shareArticle('${item.title}', '${item.link}')">
                ↗ اشتراک
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function searchNews(query) {
      if (!query || query.trim() === '') {
        renderList(loadedNews);
        return;
      }
      const q = query.toLowerCase().trim();
      const filtered = loadedNews.filter(i => i.title.toLowerCase().includes(q) || i.snippet.toLowerCase().includes(q));
      renderList(filtered);
    }

    function openLink(url) {
      if (tg && tg.openLink) { tg.openLink(url); } else { window.open(url, '_blank'); }
    }

    function shareArticle(title, url) {
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`;
      if (tg && tg.openTelegramLink) { tg.openTelegramLink(shareUrl); } else { window.open(shareUrl, '_blank'); }
    }

    function toggleSave(enc) {
      const item = JSON.parse(decodeURIComponent(enc));
      const idx = bookmarks.findIndex(b => b.link === item.link);
      if (idx > -1) {
        bookmarks.splice(idx, 1);
        showToast('از نشان‌شده‌ها حذف شد');
      } else {
        bookmarks.push(item);
        showToast('به نشان‌شده‌ها اضافه شد');
      }
      localStorage.setItem('mizan_bookmarks', JSON.stringify(bookmarks));
      if (currentScreen === 'fav') renderBookmarks(); else renderList(loadedNews);
    }

    function renderBookmarks() {
      const container = document.getElementById('feedList');
      container.innerHTML = '';
      if (bookmarks.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-muted);">هیچ خبری نشان نشده است.</div>';
        return;
      }
      renderList(bookmarks);
    }

    function setScreen(s) {
      currentScreen = s;
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      const tabs = document.getElementById('tabsBar');
      const search = document.getElementById('searchBox');

      if (s === 'home') {
        document.getElementById('btn-home').classList.add('active');
        tabs.style.display = 'block';
        search.style.display = 'block';
        renderList(loadedNews);
      } else {
        document.getElementById('btn-fav').classList.add('active');
        tabs.style.display = 'none';
        search.style.display = 'none';
        renderBookmarks();
      }
    }

    function syncData() {
      showToast('بروزرسانی زنده...');
      fetchFreshNews(currentCat);
    }

    // لیسنر تب‌های موضوعی
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentCat = this.dataset.cat;
        document.getElementById('searchInput').value = '';
        this.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        fetchFreshNews(currentCat);
      });
    });

    // شروع و بروزرسانی خودکار هر ۳ دقیقه
    fetchFreshNews(currentCat);
    setInterval(() => {
      if (currentScreen === 'home') fetchFreshNews(currentCat);
    }, 3 * 60 * 1000);
  </script>
</body>
</html>
