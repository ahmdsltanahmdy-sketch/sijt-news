<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اخبار میزان</title>
  <!-- اسکریپت مینی‌اپ تلگرام -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f5f8);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #1a1a1a);
      --hint-color: var(--tg-theme-hint-color, #8e8e93);
      --link-color: var(--tg-theme-link-color, #007aff);
      --btn-bg: var(--tg-theme-button-color, #007aff);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0 0 70px 0; /* فاصله برای منوی چسبان پایین */
      background-color: var(--bg-color);
      color: var(--text-color);
      -webkit-tap-highlight-color: transparent;
    }
    .header {
      position: sticky;
      top: 0;
      background: var(--card-bg);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      z-index: 100;
    }
    .header-title { font-weight: bold; font-size: 1rem; }
    .status-badge {
      font-size: 0.75rem;
      background: rgba(0, 122, 255, 0.1);
      color: var(--link-color);
      padding: 4px 8px;
      border-radius: 20px;
    }

    /* تب‌های دسته‌بندی موضوعی */
    .tabs-bar {
      display: flex;
      overflow-x: auto;
      background: var(--card-bg);
      padding: 8px 12px;
      gap: 8px;
      scrollbar-width: none;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }
    .tabs-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      white-space: nowrap;
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 0.82rem;
      border: 1px solid rgba(0,0,0,0.08);
      background: transparent;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--btn-bg);
      color: var(--btn-text);
      border-color: var(--btn-bg);
    }

    /* بخش کارت‌های خبر */
    #news-container {
      padding: 12px 14px;
    }
    .news-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      align-items: flex-start;
    }
    .news-thumb {
      width: 84px;
      height: 74px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      background: #e5e5ea;
    }
    .news-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 74px;
    }
    .news-title {
      text-decoration: none;
      color: var(--text-color);
      font-weight: 600;
      font-size: 0.88rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .news-snippet {
      font-size: 0.78rem;
      color: var(--hint-color);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
      margin-bottom: 6px;
    }
    .news-date {
      font-size: 0.72rem;
      color: var(--hint-color);
    }

    /* نوار ناوبری پایین صفحه (منو) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: var(--card-bg);
      border-top: 1px solid rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: none;
      border: none;
      color: var(--hint-color);
      font-size: 0.75rem;
      cursor: pointer;
    }
    .nav-item.active {
      color: var(--link-color);
      font-weight: 600;
    }
    .nav-icon { font-size: 1.2rem; }

    .loader {
      text-align: center;
      padding: 30px 10px;
      color: var(--hint-color);
      font-size: 0.88rem;
    }
  </style>
</head>
<body>

  <!-- نوار بالای صفحه -->
  <div class="header">
    <div class="header-title">⚖️ خبرگزاری میزان</div>
    <div class="status-badge" id="timer-badge">در حال بارگذاری...</div>
  </div>

  <!-- منوی دسته‌بندی موضوعی (تب‌ها) -->
  <div class="tabs-bar">
    <button class="tab-btn active" onclick="switchCategory('all', this)">همه اخبار</button>
    <button class="tab-btn" onclick="switchCategory('judicial', this)">حقوقی و قضایی</button>
    <button class="tab-btn" onclick="switchCategory('political', this)">سیاسی</button>
    <button class="tab-btn" onclick="switchCategory('social', this)">اجتماعی</button>
  </div>

  <!-- لیست اخبار -->
  <div id="news-container">
    <div class="loader">در حال دریافت اخبار...</div>
  </div>

  <!-- منوی پایین صفحه -->
  <div class="bottom-nav">
    <button class="nav-item active" onclick="changeNav(this)">
      <span class="nav-icon">📰</span>
      <span>آرشیو</span>
    </button>
    <button class="nav-item" onclick="manualRefresh(this)">
      <span class="nav-icon">🔄</span>
      <span>تازه‌سازی</span>
    </button>
    <button class="nav-item" onclick="openOriginalArchive()">
      <span class="nav-icon">🌐</span>
      <span>سایت اصلی</span>
    </button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // فیدهای دسته‌بندی میزان
    const FEEDS = {
      all: 'https://www.mizanonline.ir/fa/rss/allnews',
      judicial: 'https://www.mizanonline.ir/fa/rss/1',
      political: 'https://www.mizanonline.ir/fa/rss/2',
      social: 'https://www.mizanonline.ir/fa/rss/3'
    };

    let currentCategory = 'all';
    const DEFAULT_THUMB = 'https://www.mizanonline.ir/static/images/logo.png';

    // استخراج آدرس تصویر از داخل تگ‌های فید
    function extractImage(item) {
      if (item.enclosure && item.enclosure.link) {
        return item.enclosure.link;
      }
      if (item.thumbnail && item.thumbnail.length > 0) {
        return item.thumbnail;
      }
      // استخراج از داخل کد HTML متن خبر (تگ <img>)
      const doc = new DOMParser().parseFromString(item.description, 'text/html');
      const img = doc.querySelector('img');
      if (img && img.src) {
        return img.src;
      }
      return DEFAULT_THUMB;
    }

    async function loadNews() {
      const container = document.getElementById('news-container');
      const timerBadge = document.getElementById('timer-badge');
      const rss = FEEDS[currentCategory] || FEEDS.all;
      const api = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rss)}&_t=${Date.now()}`;

      try {
        const res = await fetch(api);
        const data = await res.json();

        if (data.status === 'ok' && data.items.length > 0) {
          container.innerHTML = '';
          data.items.forEach(item => {
            const imgUrl = extractImage(item);

            // تمیز کردن متن توضیحات بدون کدهای HTML
            const tmp = document.createElement('div');
            tmp.innerHTML = item.description;
            const snippet = tmp.textContent.trim().slice(0, 100) + '...';

            const card = document.createElement('div');
            card.className = 'news-card';
            card.innerHTML = `
              <img class="news-thumb" src="${imgUrl}" alt="تصویر خبر" onerror="this.src='${DEFAULT_THUMB}'" />
              <div class="news-content">
                <a class="news-title" href="${item.link}" target="_blank">${item.title}</a>
                <div class="news-snippet">${snippet}</div>
                <div class="news-date">${item.pubDate.split(' ')[1] || ''} | ${item.pubDate.split(' ')[0] || ''}</div>
              </div>
            `;
            container.appendChild(card);
          });

          const d = new Date();
          timerBadge.innerText = `بروز: ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        } else {
          container.innerHTML = '<div class="loader">خبری در این دسته یافت نشد.</div>';
        }
      } catch (e) {
        container.innerHTML = '<div class="loader">خطا در برقراری ارتباط با فید خبر.</div>';
      }
    }

    function switchCategory(cat, el) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      currentCategory = cat;
      document.getElementById('news-container').innerHTML = '<div class="loader">در حال دریافت اخبار...</div>';
      loadNews();
    }

    function manualRefresh(btn) {
      btn.classList.add('active');
      setTimeout(() => btn.classList.remove('active'), 500);
      loadNews();
      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }
    }

    function openOriginalArchive() {
      tg.openLink('https://www.mizanonline.ir/fa/archive');
    }

    function changeNav(btn) {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // لود اولیه
    loadNews();

    // رفرش خودکار هر ۵ دقیقه
    setInterval(loadNews, 5 * 60 * 1000);
  </script>
</body>
</html>
