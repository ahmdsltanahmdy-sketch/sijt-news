<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اخبار میزان</title>
  <!-- اسکریپت مینی‌اپ تلگرام -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: var(--tg-theme-bg-color, #f4f5f7);
      color: var(--tg-theme-text-color, #1a1a1a);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .title { font-weight: bold; font-size: 1.1rem; }
    .status { font-size: 0.8rem; color: #777; }
    .news-card {
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .news-card a {
      text-decoration: none;
      color: var(--tg-theme-link-color, #007aff);
      font-weight: 600;
      font-size: 0.95rem;
      display: block;
      margin-bottom: 6px;
    }
    .news-card .date {
      font-size: 0.75rem;
      color: #888;
    }
    .news-card p {
      font-size: 0.85rem;
      color: var(--tg-theme-text-color, #444);
      margin: 5px 0 0 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">📰 آخرین اخبار میزان</div>
    <div class="status" id="timer">در حال بارگذاری...</div>
  </div>

  <div id="news-container">در حال دریافت جدیدترین اخبار...</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // باز شدن تمام صفحه

    // منبع فید خبرگزاری میزان
    const RSS_URL = 'https://www.mizanonline.ir/fa/rss/allnews';
    const API_URL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;

    async function fetchNews() {
      const container = document.getElementById('news-container');
      const timerLabel = document.getElementById('timer');

      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        if (data.status === 'ok' && data.items.length > 0) {
          container.innerHTML = '';
          data.items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'news-card';
            
            // خلاصه خبر
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = item.description;
            const cleanSnippet = tempDiv.textContent.slice(0, 120) + '...';

            card.innerHTML = `
              <a href="${item.link}" target="_blank">${item.title}</a>
              <div class="date">${item.pubDate}</div>
              <p>${cleanSnippet}</p>
            `;
            container.appendChild(card);
          });
          const now = new Date();
          timerLabel.innerText = `بروز شده: ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
        } else {
          container.innerText = 'خطا در بارگذاری اخبار.';
        }
      } catch (err) {
        container.innerText = 'مشکل در برقراری ارتباط با منبع خبر.';
      }
    }

    // دریافت بار اول
    fetchNews();

    // رفرش خودکار هر ۵ دقیقه (۳۰۰،۰۰۰ میلی‌ثانیه)
    setInterval(fetchNews, 5 * 60 * 1000);
  </script>
</body>
</html>
