<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>خبرگزاری میزان | پیشخوان هوشمند</title>
  <!-- کتابخانه رسمی مینی‌اپ تلگرام -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-primary: var(--tg-theme-bg-color, #0f141c);
      --bg-secondary: var(--tg-theme-secondary-bg-color, #182230);
      --card-bg: var(--tg-theme-section-bg-color, #1d2736);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: var(--tg-theme-text-color, #f4f6fb);
      --text-muted: var(--tg-theme-hint-color, #94a3b8);
      --accent: var(--tg-theme-button-color, #0ea5e9);
      --accent-gradient: linear-gradient(135deg, #0284c7, #38bdf8);
      --badge-bg: rgba(14, 165, 233, 0.15);
      --danger: #ef4444;
      --nav-height: 62px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", Tahoma, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding-bottom: calc(var(--nav-height) + 18px);
      user-select: none;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* هدر مدرن */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: rgba(24, 34, 48, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      background: var(--accent-gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      box-shadow: 0 3px 12px rgba(14, 165, 233, 0.4);
    }

    .brand-text h1 {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .brand-text span {
      font-size: 0.68rem;
      color: var(--text-muted);
      display: block;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      font-size: 0.72rem;
      background: var(--badge-bg);
      color: var(--accent);
      border: 1px solid rgba(14, 165, 233, 0.25);
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    /* کادر جستجوی سریع */
    .search-wrapper {
      padding: 10px 14px 4px 14px;
      background: var(--bg-secondary);
    }

    .search-input-box {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 7px 12px;
      gap: 8px;
    }

    .search-input-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.82rem;
      width: 100%;
    }

    .search-input-box input::placeholder {
      color: var(--text-muted);
    }

    /* تب‌های اسکرول‌شونده دسته‌بندی */
    .tabs-wrapper {
      position: sticky;
      top: 55px;
      z-index: 190;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--card-border);
      padding: 6px 12px 10px 12px;
    }

    .tabs-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .tabs-scroll::-webkit-scrollbar { display: none; }

    .tab-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-chip.active {
      background: var(--accent-gradient);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 3px 10px rgba(14, 165, 233, 0.35);
      font-weight: 600;
      transform: translateY(-1px);
    }

    /* کانتینر فید */
    .main-content {
      padding: 12px 14px;
      max-width: 720px;
      margin: 0 auto;
    }

    /* کارت خبر */
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s ease;
    }

    .news-card:active {
      transform: scale(0.985);
    }

    .card-top {
      display: flex;
      padding: 12px;
      gap: 12px;
      cursor: pointer;
    }

    .thumb-wrapper {
      position: relative;
      width: 104px;
      height: 86px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      background: #121824;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 10px;
    }

    .thumb-fallback {
      display: none;
      font-size: 2rem;
      color: var(--text-muted);
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .news-title {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .news-snippet {
      font-size: 0.76rem;
      color: var(--text-muted);
      line-height: 1.38;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* نوار عملیات پایین هر کارت */
    .card-footer {
      background: rgba(0, 0, 0, 0.12);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding: 7px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .footer-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border-radius: 6px;
      transition: color 0.2s;
    }

    .action-btn:active {
      color: var(--accent);
    }

    /* بار ناوبری پایین صفحه */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: rgba(24, 34, 48, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 300;
      padding: 0 10px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 0.72rem;
      cursor: pointer;
      flex: 1;
      padding: 6px 0;
      transition: all 0.2s ease;
    }

    .nav-btn .icon {
      font-size: 1.25rem;
    }

    .nav-btn.active {
      color: var(--accent);
      font-weight: 600;
      transform: translateY(-2px);
    }

    /* لودر اسکلتون */
    .skeleton-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      border: 1px solid var(--card-border);
    }
    .skeleton-thumb {
      width: 104px;
      height: 86px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      animation: pulse 1.5s infinite ease-in-out;
    }
    .skeleton-lines {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
    }
    .skeleton-line {
      height: 12px;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      animation: pulse 1.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }

    /* اعلان شناور */
    .toast-msg {
      position: fixed;
      bottom: 78px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0, 0, 0, 0.88);
      color: #fff;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.78rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 1000;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- هدر -->
  <header class="app-header">
    <div class="brand-box">
      <div class="brand-logo">⚖️</div>
      <div class="brand-text">
        <h1>خبرگزاری میزان</h1>
        <span>پیشخوان هوشمند اخبار رسمی</span>
      </div>
    </div>
    <div class="header-actions">
      <div class="status-pill">
        <span class="status-dot"></span>
        <span id="refresh-indicator">لحظه‌ای</span>
      </div>
    </div>
  </header>

  <!-- کادر جستجو -->
  <div class="search-wrapper" id="searchBox">
    <div class="search-input-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="جستجو در میان اخبار این دسته..." oninput="handleSearch(this.value)" />
    </div>
  </div>

  <!-- تب‌های دسته‌بندی موضوعی کامل -->
  <nav class="tabs-wrapper" id="tabsNav">
    <div class="tabs-scroll" id="tabsScroll">
      <button class="tab-chip active" data-cat="all">📌 همه اخبار</button>
      <button class="tab-chip" data-cat="judicial">⚖️ قضایی</button>
      <button class="tab-chip" data-cat="human_rights">🕊️ حقوق بشر</button>
      <button class="tab-chip" data-cat="law_magazine">📖 مجله حقوقی</button>
      <button class="tab-chip" data-cat="politics">🏛️ سیاست</button>
      <button class="tab-chip" data-cat="society">👥 جامعه</button>
      <button class="tab-chip" data-cat="culture">🎭 فرهنگی</button>
      <button class="tab-chip" data-cat="economy">📈 اقتصاد</button>
      <button class="tab-chip" data-cat="sports">⚽ ورزشی</button>
      <button class="tab-chip" data-cat="world">🌍 جهان</button>
      <button class="tab-chip" data-cat="photos">📸 عکس</button>
    </div>
  </nav>

  <!-- لیست اخبار -->
  <main class="main-content" id="feed-container">
    <div class="skeleton-card">
      <div class="skeleton-thumb"></div>
      <div class="skeleton-lines">
        <div class="skeleton-line" style="width: 85%;"></div>
        <div class="skeleton-line" style="width: 60%;"></div>
        <div class="skeleton-line" style="width: 40%;"></div>
      </div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton-thumb"></div>
      <div class="skeleton-lines">
        <div class="skeleton-line" style="width: 75%;"></div>
        <div class="skeleton-line" style="width: 50%;"></div>
        <div class="skeleton-line" style="width: 40%;"></div>
      </div>
    </div>
  </main>

  <div class="toast-msg" id="toast">اعلان سیستم</div>

  <!-- منوی پایین -->
  <footer class="bottom-bar">
    <button class="nav-btn active" id="nav-news" onclick="switchNavView('news')">
      <span class="icon">📑</span>
      <span>پیشخوان</span>
    </button>
    <button class="nav-btn" id="nav-bookmarks" onclick="switchNavView('bookmarks')">
      <span class="icon">⭐</span>
      <span>نشان‌شده‌ها</span>
    </button>
    <button class="nav-btn" onclick="forceManualRefresh()">
      <span class="icon">🔄</span>
      <span>تازه‌سازی</span>
    </button>
    <button class="nav-btn" onclick="openArchivePortal()">
      <span class="icon">🌐</span>
      <span>سایت اصلی</span>
    </button>
  </footer>

  <script>
    const tg = window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // فیدهای مستقیم RSS میزان
    const RSS_ENDPOINTS = {
      all: 'https://www.mizanonline.ir/fa/rss/allnews',
      judicial: 'https://www.mizanonline.ir/fa/rss/17',
      human_rights: 'https://www.mizanonline.ir/fa/rss/7',
      law_magazine: 'https://www.mizanonline.ir/fa/rss/16',
      politics: 'https://www.mizanonline.ir/fa/rss/10',
      society: 'https://www.mizanonline.ir/fa/rss/9',
      culture: 'https://www.mizanonline.ir/fa/rss/12',
      economy: 'https://www.mizanonline.ir/fa/rss/11',
      sports: 'https://www.mizanonline.ir/fa/rss/13',
      world: 'https://www.mizanonline.ir/fa/rss/14',
      photos: 'https://www.mizanonline.ir/fa/rss/4'
    };

    let activeCategory = 'all';
    let currentView = 'news';
    let currentNewsList = [];
    let savedBookmarks = JSON.parse(localStorage.getItem('mizan_bookmarks') || '[]');

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function triggerHaptic(type = 'light') {
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred(type);
      }
    }

    // الگوریتم چندمرحله‌ای و مطمئن استخراج تصویر نمایه
    function extractArticleImage(item) {
      // ۱. بررسی تگ استاندارد enclosure
      if (item.enclosure && item.enclosure.link && item.enclosure.link.match(/\.(jpg|jpeg|png|webp)/i)) {
        return item.enclosure.link;
      }
      // ۲. بررسی فیلد thumbnail
      if (item.thumbnail && item.thumbnail.length > 5 && item.thumbnail.startsWith('http')) {
        return item.thumbnail;
      }
      // ۳. بررسی تگ‌های رسانه‌ای media:content / media:thumbnail
      if (item['media:content'] && item['media:content'].$ && item['media:content'].$.url) {
        return item['media:content'].$.url;
      }
      // ۴. پویش محتوای متن و description برای یافتن تگ img و src آن
      const htmlString = (item.content || '') + ' ' + (item.description || '');
      if (htmlString.includes('<img')) {
        const doc = new DOMParser().parseFromString(htmlString, 'text/html');
        const img = doc.querySelector('img');
        if (img && img.src && !img.src.includes('clear.gif') && !img.src.includes('pixel')) {
          return img.src;
        }
      }
      // ۵. استخراج عکس از طریق regex مستقیم
      const regexMatch = htmlString.match(/src=["'](https?:\/\/[^"']+\.(?:jpg|jpeg|png|webp)[^"']*)["']/i);
      if (regexMatch && regexMatch[1]) {
        return regexMatch[1];
      }

      return null;
    }

    function cleanDescription(desc) {
      if (!desc) return '';
      const doc = new DOMParser().parseFromString(desc, 'text/html');
      return (doc.body.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 110) + '...';
    }

    function renderCards(list) {
      const container = document.getElementById('feed-container');
      container.innerHTML = '';

      if (!list || list.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:50px 20px; color:var(--text-muted); font-size:0.85rem;">خبری مطابق با جستجو پیدا نشد.</div>';
        return;
      }

      list.forEach(item => {
        const hasImg = !!item.image;
        const isSaved = savedBookmarks.some(b => b.link === item.link);

        const card = document.createElement('div');
        card.className = 'news-card';
        card.innerHTML = `
          <div class="card-top" onclick="openLink('${item.link}')">
            <div class="thumb-wrapper">
              ${hasImg ? 
                `<img class="thumb-img" src="${item.image}" alt="عکس خبر" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
                 <span class="thumb-fallback" style="display:none;">⚖️</span>` 
                : `<span class="thumb-fallback" style="display:block;">⚖️</span>`
              }
            </div>
            <div class="card-body">
              <div class="news-title">${item.title}</div>
              <div class="news-snippet">${item.snippet}</div>
            </div>
          </div>
          <div class="card-footer">
            <span>🕒 ${item.pubDate}</span>
            <div class="footer-actions">
              <button class="action-btn" onclick="toggleBookmark('${encodeURIComponent(JSON.stringify(item))}')">
                ${isSaved ? '★ ذخیره شد' : '☆ ذخیره'}
              </button>
              <button class="action-btn" onclick="shareArticle('${item.title}', '${item.link}')">
                ↗ اشتراک
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function loadCategoryFeed() {
      const container = document.getElementById('feed-container');
      const indicator = document.getElementById('refresh-indicator');

      if (currentView === 'bookmarks') {
        renderBookmarks();
        return;
      }

      const rssUrl = RSS_ENDPOINTS[activeCategory] || RSS_ENDPOINTS.all;
      const api = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}&_t=${Date.now()}`;

      try {
        indicator.innerText = 'دریافت...';
        const res = await fetch(api);
        const data = await res.json();

        if (data.status === 'ok' && data.items && data.items.length > 0) {
          currentNewsList = data.items.map(item => {
            const timeStr = item.pubDate ? (item.pubDate.split(' ')[1] || item.pubDate) : '';
            return {
              title: item.title,
              link: item.link,
              pubDate: timeStr,
              snippet: cleanDescription(item.description),
              image: extractArticleImage(item)
            };
          });

          renderCards(currentNewsList);
          const d = new Date();
          indicator.innerText = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        } else {
          container.innerHTML = '<div style="text-align:center; padding:50px; color:var(--text-muted);">موردی یافت نشد.</div>';
          indicator.innerText = 'خطا';
        }
      } catch (err) {
        container.innerHTML = '<div style="text-align:center; padding:50px; color:var(--text-muted);">عدم برقراری ارتباط با فید.</div>';
        indicator.innerText = 'قطع ارتباط';
      }
    }

    function handleSearch(term) {
      if (!term || term.trim() === '') {
        renderCards(currentNewsList);
        return;
      }
      const q = term.toLowerCase().trim();
      const filtered = currentNewsList.filter(item => 
        item.title.toLowerCase().includes(q) || item.snippet.toLowerCase().includes(q)
      );
      renderCards(filtered);
    }

    function openLink(url) {
      triggerHaptic('light');
      if (tg && tg.openLink) {
        tg.openLink(url);
      } else {
        window.open(url, '_blank');
      }
    }

    function shareArticle(title, url) {
      triggerHaptic('medium');
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`;
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(shareUrl);
      } else {
        window.open(shareUrl, '_blank');
      }
    }

    function toggleBookmark(rawItem) {
      triggerHaptic('rigid');
      const item = JSON.parse(decodeURIComponent(rawItem));
      const index = savedBookmarks.findIndex(b => b.link === item.link);

      if (index > -1) {
        savedBookmarks.splice(index, 1);
        showToast('از نشان‌شده‌ها حذف شد');
      } else {
        savedBookmarks.push(item);
        showToast('به نشان‌شده‌ها اضافه شد');
      }
      localStorage.setItem('mizan_bookmarks', JSON.stringify(savedBookmarks));

      if (currentView === 'bookmarks') {
        renderBookmarks();
      } else {
        renderCards(currentNewsList);
      }
    }

    function renderBookmarks() {
      const container = document.getElementById('feed-container');
      container.innerHTML = '';

      if (savedBookmarks.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:60px 20px; color:var(--text-muted); font-size:0.85rem;">هنوز هیچ خبری را نشان نکرده‌اید.</div>';
        return;
      }

      savedBookmarks.forEach(item => {
        const card = document.createElement('div');
        card.className = 'news-card';
        card.innerHTML = `
          <div class="card-top" onclick="openLink('${item.link}')">
            <div class="thumb-wrapper">
              ${item.image ? 
                `<img class="thumb-img" src="${item.image}" alt="عکس خبر" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
                 <span class="thumb-fallback" style="display:none;">⚖️</span>`
                : `<span class="thumb-fallback" style="display:block;">⚖️</span>`
              }
            </div>
            <div class="card-body">
              <div class="news-title">${item.title}</div>
              <div class="news-snippet" style="margin-top:4px;">🕒 ${item.pubDate}</div>
            </div>
          </div>
          <div class="card-footer">
            <span>ذخیره‌شده</span>
            <div class="footer-actions">
              <button class="action-btn" style="color:var(--danger);" onclick="toggleBookmark('${encodeURIComponent(JSON.stringify(item))}')">
                🗑 حذف
              </button>
              <button class="action-btn" onclick="shareArticle('${item.title}', '${item.link}')">
                ↗ اشتراک
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function switchNavView(view) {
      triggerHaptic('light');
      currentView = view;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      const tabs = document.getElementById('tabsNav');
      const search = document.getElementById('searchBox');

      if (view === 'news') {
        document.getElementById('nav-news').classList.add('active');
        tabs.style.display = 'block';
        search.style.display = 'block';
        renderCards(currentNewsList);
      } else if (view === 'bookmarks') {
        document.getElementById('nav-bookmarks').classList.add('active');
        tabs.style.display = 'none';
        search.style.display = 'none';
        renderBookmarks();
      }
    }

    function forceManualRefresh() {
      triggerHaptic('success');
      showToast('در حال بروزرسانی...');
      loadCategoryFeed();
    }

    function openArchivePortal() {
      triggerHaptic('light');
      openLink('https://www.mizanonline.ir/fa/archive');
    }

    // لیسنر تب‌ها
    document.querySelectorAll('.tab-chip').forEach(chip => {
      chip.addEventListener('click', function() {
        triggerHaptic('selection_changed');
        document.querySelectorAll('.tab-chip').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        activeCategory = this.dataset.cat;
        
        // ریست سرچ
        document.getElementById('searchInput').value = '';

        this.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

        document.getElementById('feed-container').innerHTML = `
          <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-lines"><div class="skeleton-line" style="width:85%;"></div><div class="skeleton-line" style="width:60%;"></div></div></div>
          <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-lines"><div class="skeleton-line" style="width:75%;"></div><div class="skeleton-line" style="width:40%;"></div></div></div>
        `;
        loadCategoryFeed();
      });
    });

    // شروع و چرخه ۵ دقیقه‌ای
    loadCategoryFeed();
    setInterval(loadCategoryFeed, 5 * 60 * 1000);
  </script>
</body>
</html>
