<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>خبرگزاری میزان | پیشخوان هوشمند</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root[data-theme="mizan-red"] {
      --bg: #f4f5f8;
      --card-bg: #ffffff;
      --header-bg: #900000;
      --text: #1a202c;
      --text-muted: #64748b;
      --accent: #b91c1c;
      --accent-grad: linear-gradient(135deg, #990000, #dc2626);
      --border: #e2e8f0;
      --pill: rgba(185, 28, 28, 0.08);
      --card-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    :root[data-theme="dark"] {
      --bg: #0b111e;
      --card-bg: #162032;
      --header-bg: #101726;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-grad: linear-gradient(135deg, #0284c7, #38bdf8);
      --border: rgba(255, 255, 255, 0.08);
      --pill: rgba(56, 189, 248, 0.12);
      --card-shadow: 0 4px 12px rgba(0,0,0,0.25);
    }
    :root[data-theme="amoled"] {
      --bg: #000000;
      --card-bg: #0a0a0a;
      --header-bg: #000000;
      --text: #ffffff;
      --text-muted: #888888;
      --accent: #ef4444;
      --accent-grad: linear-gradient(135deg, #b91c1c, #ef4444);
      --border: #222222;
      --pill: rgba(239, 68, 68, 0.15);
      --card-shadow: none;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", Tahoma, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 74px;
      user-select: none;
      min-height: 100vh;
      font-size: 13.5px;
      line-height: 1.5;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* هدر */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--header-bg);
      color: #fff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .brand-title { font-size: 1.05rem; font-weight: 800; }
    .brand-status { font-size: 0.65rem; opacity: 0.85; display: block; }
    .hdr-actions { display: flex; gap: 6px; }
    .btn-h {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 0.72rem;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
    }
    .btn-h:active { transform: scale(0.95); }

    /* تب‌های موضوعی */
    .tabs-bar {
      position: sticky;
      top: 52px;
      z-index: 190;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 6px 10px;
    }
    .tabs-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs-scroll::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 0.76rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: var(--accent-grad);
      color: #ffffff;
      border-color: transparent;
      transform: translateY(-1px);
    }

    /* نوار ابزار */
    .tool-bar {
      padding: 8px 12px 2px 12px;
      display: flex;
      gap: 8px;
    }
    .search-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      gap: 6px;
    }
    .search-wrap input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.82rem;
      width: 100%;
    }
    .sort-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 10px;
      padding: 0 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    /* لیست اخبار */
    .feed-container {
      padding: 8px 12px;
      max-width: 680px;
      margin: 0 auto;
    }
    .card-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
    }
    .card-touch {
      display: flex;
      padding: 10px;
      gap: 10px;
      cursor: pointer;
    }
    .img-wrap {
      width: 95px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .img-fallback {
      display: none;
      font-size: 1.8rem;
      color: #a0aec0;
    }
    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }
    .card-title {
      font-size: 0.86rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 3px;
    }
    .card-lead {
      font-size: 0.74rem;
      color: var(--text-muted);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-footer {
      background: var(--pill);
      border-top: 1px solid var(--border);
      padding: 5px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .act-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.74rem;
      padding: 2px 6px;
      font-family: inherit;
    }
    .act-btn:active { color: var(--accent); }

    /* مودال مطالعه خبر درون اپلیکیشن */
    .reader-modal {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 400;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }
    .reader-modal.active { display: flex; }
    .reader-header {
      position: sticky;
      top: 0;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .reader-body {
      padding: 16px;
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
    }
    .reader-img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .reader-title {
      font-size: 1.1rem;
      font-weight: 800;
      line-height: 1.45;
      margin-bottom: 10px;
    }
    .reader-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: flex;
      gap: 12px;
    }
    .reader-text {
      font-size: 0.9rem;
      line-height: 1.7;
      color: var(--text);
    }

    /* نوار پایین */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 300;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      font-size: 0.7rem;
      cursor: pointer;
      flex: 1;
      font-family: inherit;
    }
    .nav-btn.active { color: var(--accent); font-weight: 700; }
    .nav-btn .icon { font-size: 1.15rem; }

    /* اسکلتون لودینگ */
    .skeleton-box {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      border: 1px solid var(--border);
    }
    .sk-t {
      width: 95px;
      height: 80px;
      border-radius: 8px;
      background: rgba(160, 174, 192, 0.15);
      animation: pulse 1s infinite ease-in-out;
    }
    .sk-c { flex: 1; display: flex; flex-direction: column; gap: 8px; justify-content: center; }
    .sk-l { height: 10px; border-radius: 5px; background: rgba(160, 174, 192, 0.15); animation: pulse 1s infinite ease-in-out; }
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 0.7; } 100% { opacity: 0.3; } }

    .toast {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(15px);
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 6px 16px;
      border-radius: 18px;
      font-size: 0.75rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s;
      z-index: 1000;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body data-theme="mizan-red">

  <header class="top-header">
    <div>
      <div class="brand-title">خبرگزاری میزان</div>
      <span class="brand-status" id="clock-status">آماده دریافت</span>
    </div>
    <div class="hdr-actions">
      <button class="btn-h" onclick="manualSync()">🔄 تازه‌سازی</button>
      <button class="btn-h" onclick="toggleTheme()">🎨 <span id="lbl-theme">میزان</span></button>
    </div>
  </header>

  <nav class="tabs-bar" id="tabsBar">
    <div class="tabs-scroll">
      <button class="tab-btn active" data-cat="all">📌 همه اخبار</button>
      <button class="tab-btn" data-cat="judicial">⚖️ قضایی</button>
      <button class="tab-btn" data-cat="human_rights">🕊️ حقوق بشر</button>
      <button class="tab-btn" data-cat="law_magazine">📖 مجله حقوقی</button>
      <button class="tab-btn" data-cat="politics">🏛️ سیاست</button>
      <button class="tab-btn" data-cat="society">👥 جامعه</button>
      <button class="tab-btn" data-cat="culture">🎭 فرهنگی</button>
      <button class="tab-btn" data-cat="economy">📈 اقتصاد</button>
      <button class="tab-btn" data-cat="sports">⚽ ورزشی</button>
      <button class="tab-btn" data-cat="world">🌍 جهان</button>
      <button class="tab-btn" data-cat="photos">📸 عکس</button>
    </div>
  </nav>

  <div class="tool-bar" id="toolBar">
    <div class="search-wrap">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="جستجوی آنی در اخبار..." oninput="filterData(this.value)" />
    </div>
    <button class="sort-btn" onclick="toggleSort()">
      <span>⇅</span>
      <span id="lbl-sort">جدیدترین</span>
    </button>
  </div>

  <main class="feed-container" id="feedList">
    <div class="skeleton-box"><div class="sk-t"></div><div class="sk-c"><div class="sk-l" style="width:85%;"></div><div class="sk-l" style="width:60%;"></div></div></div>
    <div class="skeleton-box"><div class="sk-t"></div><div class="sk-c"><div class="sk-l" style="width:75%;"></div><div class="sk-l" style="width:50%;"></div></div></div>
  </main>

  <div class="reader-modal" id="readerModal">
    <div class="reader-header">
      <button class="btn-h" style="background:var(--accent);color:#fff;" onclick="closeReader()">بازگشت ✕</button>
      <button class="btn-h" style="background:transparent;color:var(--text);border-color:var(--border);" onclick="openExternalFromReader()">سایت اصلی ↗</button>
    </div>
    <div class="reader-body">
      <img id="readerImg" class="reader-img" src="" alt="تصویر خبر" onerror="this.style.display='none';" />
      <h2 id="readerTitle" class="reader-title"></h2>
      <div class="reader-meta">
        <span id="readerDate"></span>
        <span>خبرگزاری میزان</span>
      </div>
      <div id="readerText" class="reader-text"></div>
    </div>
  </div>

  <div class="toast" id="toastBox">پیام</div>

  <footer class="bottom-nav">
    <button class="nav-btn active" id="btn-home" onclick="setScreen('home')">
      <span class="icon">📰</span>
      <span>پیشخوان</span>
    </button>
    <button class="nav-btn" id="btn-fav" onclick="setScreen('fav')">
      <span class="icon">⭐</span>
      <span>نشان‌شده‌ها</span>
    </button>
    <button class="nav-btn" onclick="manualSync()">
      <span class="icon">🔄</span>
      <span>تازه‌سازی فوری</span>
    </button>
    <button class="nav-btn" onclick="openDirect('https://www.mizanonline.ir/fa/archive')">
      <span class="icon">🌐</span>
      <span>سایت اصلی</span>
    </button>
  </footer>

  <script>
    const tg = window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const CATEGORIES = {
      all: 'allnews',
      judicial: '17',
      human_rights: '7',
      law_magazine: '16',
      politics: '10',
      society: '9',
      culture: '12',
      economy: '11',
      sports: '13',
      world: '14',
      photos: '4'
    };

    const THEMES = ['mizan-red', 'dark', 'amoled'];
    const THEME_NAMES = { 'mizan-red': 'میزان', 'dark': 'تاریک', 'amoled': 'مشکی' };

    let currentTheme = localStorage.getItem('mizan_theme_final') || 'mizan-red';
    let currentCat = 'all';
    let currentScreen = 'home';
    let isSortAsc = false;
    let activeNews = [];
    let currentReading = null;
    let bookmarks = JSON.parse(localStorage.getItem('mizan_favs_final') || '[]');

    function applyTheme(t) {
      document.body.setAttribute('data-theme', t);
      localStorage.setItem('mizan_theme_final', t);
      document.getElementById('lbl-theme').innerText = THEME_NAMES[t] || t;
    }

    function toggleTheme() {
      const idx = (THEMES.indexOf(currentTheme) + 1) % THEMES.length;
      currentTheme = THEMES[idx];
      applyTheme(currentTheme);
      showToast(`تم ${THEME_NAMES[currentTheme]}`);
    }

    function showToast(msg) {
      const t = document.getElementById('toastBox');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function cleanSnippet(txt) {
      if (!txt) return '';
      const doc = new DOMParser().parseFromString(txt, 'text/html');
      return (doc.body.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 115) + '...';
    }

    function extractImage(description, itemNode) {
      if (itemNode) {
        const enc = itemNode.querySelector('enclosure');
        if (enc && enc.getAttribute('url')) return enc.getAttribute('url');
      }
      if (description) {
        const match = description.match(/src=["']([^"']+\.(?:jpg|jpeg|png|webp)[^"']*)["']/i);
        if (match && match[1]) return match[1];
      }
      return null;
    }

    async function fetchLiveNews(cat) {
      const clock = document.getElementById('clock-status');
      clock.innerText = 'همگام‌سازی زنده...';

      // نمایش کش محلی بلادرنگ جهت حذف کامل تاخیر
      const local = localStorage.getItem(`cache_final_${cat}`);
      if (local && activeNews.length === 0) {
        try {
          activeNews = JSON.parse(local);
          renderList(activeNews);
        } catch(e) {}
      }

      const feedCode = CATEGORIES[cat] || 'allnews';
      const rawRss = `https://www.mizanonline.ir/fa/rss/${feedCode}`;
      const nocacheParam = `_t=${Date.now()}&_r=${Math.random()}`;

      // پروکسی‌های بدون کش
      const endpoints = [
        `https://corsproxy.io/?url=${encodeURIComponent(rawRss + '?' + nocacheParam)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(rawRss + '?' + nocacheParam)}`
      ];

      let rawXml = null;

      for (const ep of endpoints) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 3500);
          const res = await fetch(ep, {
            signal: controller.signal,
            cache: 'no-store',
            headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
          });
          clearTimeout(timer);
          if (res.ok) {
            rawXml = await res.text();
            if (rawXml && rawXml.includes('<item>')) break;
          }
        } catch(e) {}
      }

      if (!rawXml || !rawXml.includes('<item>')) {
        clock.innerText = 'خطای موقت شبکه';
        return;
      }

      try {
        const xmlDoc = new DOMParser().parseFromString(rawXml, 'text/xml');
        const items = xmlDoc.querySelectorAll('item');
        const list = [];

        items.forEach(node => {
          const title = node.querySelector('title')?.textContent?.trim() || '';
          const link = node.querySelector('link')?.textContent?.trim() || '';
          const desc = node.querySelector('description')?.textContent || '';
          const pubDate = node.querySelector('pubDate')?.textContent || '';
          const time = pubDate.split(' ')[4] || pubDate.split(' ')[1] || 'ساعات قبل';

          if (title && link) {
            list.push({
              title,
              link,
              pubDate: time,
              snippet: cleanSnippet(desc),
              image: extractImage(desc, node)
            });
          }
        });

        if (list.length > 0) {
          activeNews = list;
          localStorage.setItem(`cache_final_${cat}`, JSON.stringify(activeNews));
          renderList(activeNews);
          const now = new Date();
          clock.innerText = `بروزرسانی: ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        }
      } catch (err) {
        clock.innerText = 'خطای پردازش';
      }
    }

    function renderList(list) {
      const container = document.getElementById('feedList');
      container.innerHTML = '';

      if (!list || list.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:50px;color:var(--text-muted);">خبری یافت نشد.</div>';
        return;
      }

      list.forEach(item => {
        const isFav = bookmarks.some(b => b.link === item.link);
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="card-touch" onclick="openReader('${encodeURIComponent(JSON.stringify(item))}')">
            <div class="img-wrap">
              ${item.image ? 
                `<img src="${item.image}" alt="خبر" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
                 <span class="img-fallback" style="display:none;">⚖️</span>`
                : `<span class="img-fallback" style="display:block;">⚖️</span>`
              }
            </div>
            <div class="card-body">
              <div class="card-title">${item.title}</div>
              <div class="card-lead">${item.snippet}</div>
            </div>
          </div>
          <div class="card-footer">
            <span>🕒 ${item.pubDate}</span>
            <div>
              <button class="act-btn" onclick="toggleSave('${encodeURIComponent(JSON.stringify(item))}')">
                ${isFav ? '★ نشان‌شده' : '☆ ذخیره'}
              </button>
              <button class="act-btn" onclick="shareArticle('${item.title}', '${item.link}')">
                ↗ اشتراک
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openReader(enc) {
      currentReading = JSON.parse(decodeURIComponent(enc));
      const m = document.getElementById('readerModal');
      document.getElementById('readerTitle').innerText = currentReading.title;
      document.getElementById('readerDate').innerText = `🕒 ${currentReading.pubDate}`;
      document.getElementById('readerText').innerText = currentReading.snippet;

      const imgEl = document.getElementById('readerImg');
      if (currentReading.image) {
        imgEl.src = currentReading.image;
        imgEl.style.display = 'block';
      } else {
        imgEl.style.display = 'none';
      }
      m.classList.add('active');
    }

    function closeReader() {
      document.getElementById('readerModal').classList.remove('active');
    }

    function openExternalFromReader() {
      if (currentReading && currentReading.link) openDirect(currentReading.link);
    }

    function filterData(query) {
      if (!query || query.trim() === '') {
        renderList(activeNews);
        return;
      }
      const q = query.toLowerCase().trim();
      const filtered = activeNews.filter(i => i.title.toLowerCase().includes(q) || i.snippet.toLowerCase().includes(q));
      renderList(filtered);
    }

    function toggleSort() {
      isSortAsc = !isSortAsc;
      document.getElementById('lbl-sort').innerText = isSortAsc ? 'قدیمی‌ترین' : 'جدیدترین';
      activeNews.reverse();
      renderList(activeNews);
    }

    function openDirect(url) {
      if (tg && tg.openLink) { tg.openLink(url); } else { window.open(url, '_blank'); }
    }

    function shareArticle(title, url) {
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`;
      if (tg && tg.openTelegramLink) { tg.openTelegramLink(shareUrl); } else { window.open(shareUrl, '_blank'); }
    }

    function toggleSave(enc) {
      const item = JSON.parse(decodeURIComponent(enc));
      const idx = bookmarks.findIndex(b => b.link === item.link);
      if (idx > -1) {
        bookmarks.splice(idx, 1);
        showToast('از نشان‌شده‌ها حذف شد');
      } else {
        bookmarks.push(item);
        showToast('به نشان‌شده‌ها اضافه شد');
      }
      localStorage.setItem('mizan_favs_final', JSON.stringify(bookmarks));
      if (currentScreen === 'fav') renderBookmarks(); else renderList(activeNews);
    }

    function renderBookmarks() {
      const container = document.getElementById('feedList');
      container.innerHTML = '';
      if (bookmarks.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-muted);">هیچ خبری نشان نشده است.</div>';
        return;
      }
      renderList(bookmarks);
    }

    function setScreen(s) {
      currentScreen = s;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      const tabs = document.getElementById('tabsBar');
      const tool = document.getElementById('toolBar');

      if (s === 'home') {
        document.getElementById('btn-home').classList.add('active');
        tabs.style.display = 'block';
        tool.style.display = 'flex';
        renderList(activeNews);
      } else {
        document.getElementById('btn-fav').classList.add('active');
        tabs.style.display = 'none';
        tool.style.display = 'none';
        renderBookmarks();
      }
    }

    function manualSync() {
      showToast('دریافت اخبار زنده...');
      fetchLiveNews(currentCat);
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentCat = this.dataset.cat;
        document.getElementById('searchInput').value = '';
        this.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        fetchLiveNews(currentCat);
      });
    });

    applyTheme(currentTheme);
    fetchLiveNews(currentCat);

    setInterval(() => {
      if (currentScreen === 'home') fetchLiveNews(currentCat);
    }, 2 * 60 * 1000);
  </script>
</body>
</html>
