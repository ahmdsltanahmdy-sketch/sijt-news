<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>میزان آنلاین | پیشخوان لحظه‌ای</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root[data-theme="mizan-red"] {
      --bg: #f5f6f8;
      --card-bg: #ffffff;
      --header-bg: #900000;
      --header-fg: #ffffff;
      --text: #1a202c;
      --text-muted: #718096;
      --accent: #b91c1c;
      --accent-grad: linear-gradient(135deg, #990000, #c53030);
      --border: #e2e8f0;
      --pill: rgba(185, 28, 28, 0.08);
      --card-shadow: 0 2px 5px rgba(0,0,0,0.04);
    }
    :root[data-theme="dark"] {
      --bg: #0d131f;
      --card-bg: #162032;
      --header-bg: #111a2b;
      --header-fg: #f7fafc;
      --text: #f7fafc;
      --text-muted: #a0aec0;
      --accent: #38bdf8;
      --accent-grad: linear-gradient(135deg, #0284c7, #38bdf8);
      --border: rgba(255, 255, 255, 0.08);
      --pill: rgba(56, 189, 248, 0.12);
      --card-shadow: 0 4px 12px rgba(0,0,0,0.25);
    }
    :root[data-theme="amoled"] {
      --bg: #000000;
      --card-bg: #0c0c0c;
      --header-bg: #000000;
      --header-fg: #ffffff;
      --text: #ffffff;
      --text-muted: #888888;
      --accent: #e53e3e;
      --accent-grad: linear-gradient(135deg, #9b2c2c, #e53e3e);
      --border: #222222;
      --pill: rgba(229, 62, 62, 0.15);
      --card-shadow: none;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", Tahoma, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 70px;
      user-select: none;
      min-height: 100vh;
      font-size: 13.5px;
      line-height: 1.5;
      transition: background-color 0.2s;
    }

    /* هدر */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--header-bg);
      color: var(--header-fg);
      padding: 9px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    .brand-title { font-size: 1rem; font-weight: 800; }
    .brand-status { font-size: 0.65rem; opacity: 0.85; display: block; }
    .hdr-actions { display: flex; gap: 6px; }
    .btn-h {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 4px 9px;
      border-radius: 14px;
      font-size: 0.72rem;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
    }
    .btn-h:active { transform: scale(0.95); }

    /* تب‌های موضوعی */
    .tabs-wrap {
      position: sticky;
      top: 48px;
      z-index: 190;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 6px 10px;
    }
    .tabs-list {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs-list::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 11px;
      border-radius: 14px;
      font-size: 0.76rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .tab-btn.active {
      background: var(--accent-grad);
      color: #ffffff;
      border-color: transparent;
      transform: translateY(-1px);
    }

    /* نوار ابزار */
    .bar-tool {
      padding: 6px 10px 2px 10px;
      display: flex;
      gap: 6px;
    }
    .search-inp {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
      gap: 6px;
    }
    .search-inp input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      width: 100%;
    }

    /* فید اخبار */
    .feed-container {
      padding: 8px 10px;
      max-width: 680px;
      margin: 0 auto;
    }
    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
    }
    .card-touch {
      display: flex;
      padding: 9px;
      gap: 9px;
      cursor: pointer;
    }
    .img-box {
      width: 90px;
      height: 76px;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .img-alt {
      display: none;
      font-size: 1.6rem;
      color: #a0aec0;
    }
    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }
    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1.38;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 2px;
    }
    .card-lead {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-bottom {
      background: var(--pill);
      border-top: 1px solid var(--border);
      padding: 4px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    .act-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.72rem;
      padding: 2px 5px;
      font-family: inherit;
    }
    .act-btn:active { color: var(--accent); }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 54px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 300;
    }
    .b-item {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      font-size: 0.68rem;
      cursor: pointer;
      flex: 1;
      font-family: inherit;
    }
    .b-item.active { color: var(--accent); font-weight: 700; }
    .b-item .icon { font-size: 1.1rem; }

    .skeleton-item {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 9px;
      margin-bottom: 8px;
      display: flex;
      gap: 9px;
      border: 1px solid var(--border);
    }
    .sk-t {
      width: 90px;
      height: 76px;
      border-radius: 6px;
      background: rgba(160, 174, 192, 0.15);
      animation: pulse 1s infinite;
    }
    .sk-c { flex: 1; display: flex; flex-direction: column; gap: 7px; justify-content: center; }
    .sk-l { height: 9px; border-radius: 4px; background: rgba(160, 174, 192, 0.15); animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 0.7; } 100% { opacity: 0.3; } }

    .toast {
      position: fixed;
      bottom: 66px;
      left: 50%;
      transform: translateX(-50%) translateY(15px);
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 5px 14px;
      border-radius: 16px;
      font-size: 0.74rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s;
      z-index: 1000;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body data-theme="mizan-red">

  <header class="top-header">
    <div>
      <div class="brand-title">خبرگزاری میزان</div>
      <span class="brand-status" id="clock-status">در حال دریافت اخبار زنده...</span>
    </div>
    <div class="hdr-actions">
      <button class="btn-h" onclick="manualSync()">🔄 تازه‌سازی</button>
      <button class="btn-h" onclick="switchTheme()">🎨 <span id="theme-lbl">میزان</span></button>
    </div>
  </header>

  <nav class="tabs-wrap" id="tabsWrap">
    <div class="tabs-list">
      <button class="tab-btn active" data-cat="all">📌 همه اخبار</button>
      <button class="tab-btn" data-cat="judicial">⚖️ قضایی</button>
      <button class="tab-btn" data-cat="human_rights">🕊️ حقوق بشر</button>
      <button class="tab-btn" data-cat="law_magazine">📖 مجله حقوقی</button>
      <button class="tab-btn" data-cat="politics">🏛️ سیاست</button>
      <button class="tab-btn" data-cat="society">👥 جامعه</button>
      <button class="tab-btn" data-cat="culture">🎭 فرهنگی</button>
      <button class="tab-btn" data-cat="economy">📈 اقتصاد</button>
      <button class="tab-btn" data-cat="sports">⚽ ورزشی</button>
      <button class="tab-btn" data-cat="world">🌍 جهان</button>
      <button class="tab-btn" data-cat="photos">📸 عکس</button>
    </div>
  </nav>

  <div class="bar-tool" id="barTool">
    <div class="search-inp">
      <span>🔍</span>
      <input type="text" id="srchInp" placeholder="جستجوی آنی در اخبار..." oninput="filterData(this.value)" />
    </div>
  </div>

  <main class="feed-container" id="feedList">
    <div class="skeleton-item"><div class="sk-t"></div><div class="sk-c"><div class="sk-l" style="width:85%;"></div><div class="sk-l" style="width:60%;"></div></div></div>
    <div class="skeleton-item"><div class="sk-t"></div><div class="sk-c"><div class="sk-l" style="width:75%;"></div><div class="sk-l" style="width:50%;"></div></div></div>
  </main>

  <div class="toast" id="toast">پیام</div>

  <footer class="bottom-bar">
    <button class="b-item active" id="b-home" onclick="setTab('home')">
      <span class="icon">📰</span>
      <span>پیشخوان</span>
    </button>
    <button class="b-item" id="b-fav" onclick="setTab('fav')">
      <span class="icon">⭐</span>
      <span>نشان‌شده‌ها</span>
    </button>
    <button class="b-item" onclick="manualSync()">
      <span class="icon">🔄</span>
      <span>تازه‌سازی</span>
    </button>
    <button class="b-item" onclick="openDirect('https://www.mizanonline.ir/fa/archive')">
      <span class="icon">🌐</span>
      <span>سایت اصلی</span>
    </button>
  </footer>

  <script>
    const tg = window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const CATS = {
      all: 0,
      judicial: 17,
      human_rights: 7,
      law_magazine: 16,
      politics: 10,
      society: 9,
      culture: 12,
      economy: 11,
      sports: 13,
      world: 14,
      photos: 4
    };

    const THEMES = ['mizan-red', 'dark', 'amoled'];
    const LABELS = { 'mizan-red': 'میزان', 'dark': 'تاریک', 'amoled': 'مشکی' };

    let curTheme = localStorage.getItem('mizan_theme_v3') || 'mizan-red';
    let curCat = 'all';
    let curScreen = 'home';
    let activeNews = [];
    let savedFavs = JSON.parse(localStorage.getItem('mizan_favs_v3') || '[]');

    function setTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('mizan_theme_v3', t);
      document.getElementById('theme-lbl').innerText = LABELS[t] || t;
    }

    function switchTheme() {
      const idx = (THEMES.indexOf(curTheme) + 1) % THEMES.length;
      curTheme = THEMES[idx];
      setTheme(curTheme);
      showToast(`تم ${LABELS[curTheme]}`);
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.innerText = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2000);
    }

    // تبدیل لینک تصویر به پروکسی ایمیج برای دور زدن مسدودسازی سرورهای ایران
    function getSafeImageUrl(rawUrl) {
      if (!rawUrl) return null;
      let u = rawUrl.trim();
      if (u.startsWith('//')) u = 'https:' + u;
      if (u.startsWith('/')) u = 'https://www.mizanonline.ir' + u;
      if (u.length < 15 || u.includes('pixel') || u.includes('clear.gif')) return null;
      
      // پروکسی پرسرعت تصویر با فشرده‌سازی WebP و بدون بلاک
      return `https://images.weserv.nl/?url=${encodeURIComponent(u)}&w=220&h=180&fit=cover&output=webp`;
    }

    function parseImageFromXml(desc, node) {
      // 1. بررسی enclosure
      if (node) {
        const enc = node.querySelector('enclosure');
        if (enc && enc.getAttribute('url')) return enc.getAttribute('url');
      }
      // 2. جستجوی تگ img در توضیحات
      if (desc) {
        const m = desc.match(/src=["']([^"']+\.(?:jpg|jpeg|png|webp)[^"']*)["']/i);
        if (m && m[1]) return m[1];
      }
      return null;
    }

    function parseTextLead(desc) {
      if (!desc) return '';
      const doc = new DOMParser().parseFromString(desc, 'text/html');
      return (doc.body.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 110) + '...';
    }

    // واکشی بدون واسطه و بدون کش
    async function fetchLiveNews(cat) {
      const clock = document.getElementById('clock-status');
      clock.innerText = 'همگام‌سازی لحظه‌ای...';

      const sid = CATS[cat] || 0;
      const rssUrl = sid === 0 
        ? `https://www.mizanonline.ir/fa/rss/allnews`
        : `https://www.mizanonline.ir/fa/rss/${sid}`;

      // سیستم چندپروکسی بدون کش برای دریافت در لحظه
      const timestamp = Date.now();
      const endpoints = [
        `https://corsproxy.io/?${encodeURIComponent(rssUrl + '?_t=' + timestamp)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl + '?_t=' + timestamp)}`
      ];

      let rawXml = null;

      for (const endpoint of endpoints) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 3500);
          const res = await fetch(endpoint, { signal: controller.signal, cache: 'no-store' });
          clearTimeout(timeoutId);
          if (res.ok) {
            rawXml = await res.text();
            if (rawXml && rawXml.includes('<item>')) break;
          }
        } catch(e) {
          console.warn("Retrying with next proxy...");
        }
      }

      if (!rawXml) {
        clock.innerText = 'خطا در شبکه';
        showToast('مشکل در دریافت اخبار. مجددا تلاش کنید.');
        return;
      }

      try {
        const xmlDoc = new DOMParser().parseFromString(rawXml, 'text/xml');
        const items = xmlDoc.querySelectorAll('item');
        const parsed = [];

        items.forEach(node => {
          const title = node.querySelector('title')?.textContent?.trim() || '';
          const link = node.querySelector('link')?.textContent?.trim() || '';
          const desc = node.querySelector('description')?.textContent || '';
          const pubDate = node.querySelector('pubDate')?.textContent || '';
          const time = pubDate.split(' ')[4] || pubDate.split(' ')[1] || 'چند دقیقه پیش';

          if (title && link) {
            const rawImg = parseImageFromXml(desc, node);
            parsed.push({
              title,
              link,
              pubDate: time,
              snippet: parseTextLead(desc),
              image: getSafeImageUrl(rawImg)
            });
          }
        });

        if (parsed.length > 0) {
          activeNews = parsed;
          renderCards(activeNews);
          const now = new Date();
          clock.innerText = `بروز: ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        }
      } catch (err) {
        clock.innerText = 'خطا در پردازش';
      }
    }

    function renderCards(list) {
      const box = document.getElementById('feedList');
      box.innerHTML = '';

      if (!list || list.length === 0) {
        box.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">خبری یافت نشد.</div>';
        return;
      }

      list.forEach(item => {
        const isFav = savedFavs.some(b => b.link === item.link);
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="card-touch" onclick="openDirect('${item.link}')">
            <div class="img-box">
              ${item.image ? 
                `<img src="${item.image}" alt="خبر" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
                 <span class="img-alt" style="display:none;">⚖️</span>`
                : `<span class="img-alt" style="display:block;">⚖️</span>`
              }
            </div>
            <div class="card-body">
              <div class="card-title">${item.title}</div>
              <div class="card-lead">${item.snippet}</div>
            </div>
          </div>
          <div class="card-bottom">
            <span>🕒 ${item.pubDate}</span>
            <div>
              <button class="act-btn" onclick="toggleFav('${encodeURIComponent(JSON.stringify(item))}')">
                ${isFav ? '★ نشان‌شده' : '☆ ذخیره'}
              </button>
              <button class="act-btn" onclick="shareTelegram('${item.title}', '${item.link}')">
                ↗ اشتراک
              </button>
            </div>
          </div>
        `;
        box.appendChild(card);
      });
    }

    function filterData(query) {
      if (!query || query.trim() === '') {
        renderCards(activeNews);
        return;
      }
      const q = query.toLowerCase().trim();
      const filtered = activeNews.filter(i => i.title.toLowerCase().includes(q) || i.snippet.toLowerCase().includes(q));
      renderCards(filtered);
    }

    function openDirect(url) {
      if (tg && tg.openLink) { tg.openLink(url); } else { window.open(url, '_blank'); }
    }

    function shareTelegram(title, url) {
      const share = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`;
      if (tg && tg.openTelegramLink) { tg.openTelegramLink(share); } else { window.open(share, '_blank'); }
    }

    function toggleFav(enc) {
      const item = JSON.parse(decodeURIComponent(enc));
      const idx = savedFavs.findIndex(b => b.link === item.link);
      if (idx > -1) {
        savedFavs.splice(idx, 1);
        showToast('از نشان‌شده‌ها حذف شد');
      } else {
        savedFavs.push(item);
        showToast('به نشان‌شده‌ها اضافه شد');
      }
      localStorage.setItem('mizan_favs_v3', JSON.stringify(savedFavs));
      if (curScreen === 'fav') renderFavs(); else renderCards(activeNews);
    }

    function renderFavs() {
      const box = document.getElementById('feedList');
      box.innerHTML = '';
      if (savedFavs.length === 0) {
        box.innerHTML = '<div style="text-align:center; padding:60px; color:var(--text-muted);">هیچ خبری نشان نشده است.</div>';
        return;
      }
      renderCards(savedFavs);
    }

    function setTab(s) {
      curScreen = s;
      document.querySelectorAll('.b-item').forEach(b => b.classList.remove('active'));
      const tabs = document.getElementById('tabsWrap');
      const tool = document.getElementById('barTool');

      if (s === 'home') {
        document.getElementById('b-home').classList.add('active');
        tabs.style.display = 'block';
        tool.style.display = 'flex';
        renderCards(activeNews);
      } else {
        document.getElementById('b-fav').classList.add('active');
        tabs.style.display = 'none';
        tool.style.display = 'none';
        renderFavs();
      }
    }

    function manualSync() {
      showToast('دریافت اخبار لحظه‌ای...');
      fetchLiveNews(curCat);
    }

    // لیسنر تب‌ها
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        curCat = this.dataset.cat;
        document.getElementById('srchInp').value = '';
        this.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        fetchLiveNews(curCat);
      });
    });

    setTheme(curTheme);
    fetchLiveNews(curCat);

    // بررسی منظم هر ۲ دقیقه
    setInterval(() => {
      if (curScreen === 'home') fetchLiveNews(curCat);
    }, 2 * 60 * 1000);
  </script>
</body>
</html>
